services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: cer-es
    restart: unless-stopped                   # come back after Docker Desktop / WSL restarts
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # local development only
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports: ["9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      retries: 30
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["kibana"]
    environment: [ELASTICSEARCH_HOSTS=http://elasticsearch:9200]
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
volumes:
  esdata:
